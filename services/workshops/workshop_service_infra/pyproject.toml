[project]
name = "workshop-service-infra"
version = "0.1.0"
description = "Adapters for the workshop domain: DynamoDB repository, system clock, table schema."
requires-python = ">=3.14"
dependencies = ["workshop-service-domain", "boto3>=1.36"]

[tool.uv.sources]
workshop-service-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
