name: main

# Every push to main deploys the stage prod, then runs the E2E tests against it. The test users
# and items they create are deleted afterwards. The load test against prod is manual (load.yml).
on:
  push:
    branches: [main]

concurrency:
  group: prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: make lint
      - run: make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: prod
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: uv sync --frozen
      - run: make deploy
      - run: make smoke
      - run: make test-e2e
