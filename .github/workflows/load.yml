name: load test

# Manual only. target=own-stage deploys a stage of its own (load-<run id>), runs the load test
# against it and removes it again. target=prod runs against prod, without deploy or destroy,
# and waits for any running prod deploy (same concurrency group as main.yml).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Stage to load"
        type: choice
        options: ["own-stage", "prod"]
        default: own-stage

concurrency:
  group: ${{ inputs.target == 'prod' && 'prod' || 'load-test' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: ${{ inputs.target == 'prod' && 'prod' || format('load-{0}', github.run_id) }}
      OWN_STAGE: ${{ inputs.target != 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: uv sync --frozen
      - if: env.OWN_STAGE == 'true'
        run: make deploy
      - run: make load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: reports/
      - name: Destroy the stage
        if: always() && env.OWN_STAGE == 'true' && steps.credentials.outcome == 'success'
        run: make destroy
