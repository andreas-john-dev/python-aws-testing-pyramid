name: load test

# Manual only, against a stage of your own, never a shared one.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Deployed stage to run against"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: uv sync --frozen
      - run: make load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: reports/
